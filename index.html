<style>
:root{color-scheme:light;--o:#FF3B00;--n:#2B2B2B;--bg:#EEF0F4;--cd:#fff;--tx:#23262d;--mu:#667085;--ln:#E3E6EC;--ti:#FFF1EC;--gr:#15803D;--rd:#B42318;--am:#B45309}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:14px/1.45 Inter,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#fff;color:#23262d;border-bottom:3px solid var(--o);flex-wrap:wrap}.top img.sk{width:38px;height:38px;border-radius:50%}.top b{font-size:15px}.top small{display:block;color:#667085;font-size:11px}.sp{flex:1}.pw{display:flex;align-items:center;gap:6px;font-size:11px;color:#667085}.pw img{height:30px}
.seg{display:flex;background:#EEF0F4;border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;color:#23262d;font-weight:600}.seg button.on{background:var(--o);color:#fff}
.stage{flex:1;display:flex;gap:20px;justify-content:center;align-items:flex-start;padding:16px;overflow:auto;min-height:0}
body.m-member #adw,body.m-admin #phw{display:none}
.phone{width:390px;height:min(800px,calc(100vh - 150px));min-height:620px;background:var(--cd);border-radius:36px;border:10px solid #1b1d22;display:flex;flex-direction:column;overflow:hidden;position:relative;flex:none}
.scr{flex:1;overflow:auto;padding:14px}.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln)}.hd img{width:30px;height:30px;border-radius:50%}.hd b{flex:1}
.tabs{display:flex;border-top:1px solid var(--ln);background:var(--cd)}.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:11px;color:var(--mu)}.tabs button.on{color:var(--o);font-weight:700}.tabs span{display:block;font-size:18px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}.card h4{margin:0 0 4px;font-size:15px}.mu{color:var(--mu)}.sm{font-size:12px}
.btn{border:0;background:var(--o);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600}.btn.g{background:none;color:var(--o);border:1px solid var(--o)}.btn.d{background:var(--rd)}.btn.k{background:var(--gr)}.btn[disabled]{opacity:.5}.btn.w{width:100%;padding:11px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);margin:4px 0 8px}label{font-size:12px;color:var(--mu);font-weight:600}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-style:normal;font-weight:700;flex:none}.row{display:flex;gap:10px;align-items:center}.row>.f{flex:1;min-width:0}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--ti);color:var(--o)}.chip.g{background:#dcfce7;color:#15803D}.chip.a{background:#fef3c7;color:#92400E}.chip.r{background:#fee2e2;color:#B42318}
.sec{font-weight:700;margin:14px 0 8px}.cen{padding:28px 20px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}.cen img.big{width:120px;height:120px;border-radius:50%;margin:0 auto 12px}
.mini{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:10px}.mini button{flex:1;border:0;background:none;padding:6px;border-radius:8px}.mini button.on{background:var(--cd);font-weight:700}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.side{width:170px;background:var(--n);color:#fff;padding:12px 8px;display:flex;flex-direction:column;gap:2px;flex:none}.side button{text-align:left;border:0;background:none;color:#cbd5e1;padding:9px 10px;border-radius:8px}.side button.on{background:var(--o);color:#fff}.side select{background:#1c3166;color:#fff;border:0}
.main{flex:1;padding:16px;overflow:auto;max-height:calc(100vh - 110px)}.main h2{margin:0 0 12px}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}.kp div{border:1px solid var(--ln);border-radius:12px;padding:12px}.kp b{font-size:24px;display:block;color:var(--o)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--mu);font-size:12px}.tw{overflow-x:auto}
.log{font:11px ui-monospace,monospace;max-height:230px;overflow:auto}.log span{display:inline-block;min-width:28px;font-weight:700}.log .e{color:var(--rd)}.log .k{color:var(--gr)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:9;display:none;max-width:90vw}#toast.er{background:var(--rd)}
.sim{background:#fffbeb;color:#92400E;border:1px dashed #F59E0B;border-radius:10px;padding:8px;font-size:12px;margin-bottom:8px}
@media(max-width:900px){.stage{flex-direction:column;align-items:center}}
.cap{text-align:center;margin:0 0 8px;font-size:13px;color:var(--mu)}.hd{background:var(--o);color:#fff;border:0}.hd .btn.g{color:#fff;border-color:#fff9}.hd select{width:auto;margin:0;padding:4px 6px;color:#23262d}
.phone table tr:first-child{display:none}.phone tr{display:block;border:1px solid var(--ln);border-radius:12px;padding:8px;margin-bottom:8px}.phone td{display:block;border:0;padding:3px 0}.phone .tabs button{font-size:10px}
.chat{background:#FBF3EE}.bw{display:flex;margin:4px 0}.bw.me{justify-content:flex-end}.bb{max-width:82%;padding:6px 10px;border-radius:12px;background:#fff;box-shadow:0 1px 1px #0002;white-space:pre-wrap;word-break:break-word}.me .bb{background:#FFE0D4}.bn{font-size:12px;font-weight:700}.bt{font-size:10px;color:var(--mu);text-align:right}.bt u{cursor:pointer}
.mb{display:flex;gap:8px;padding:8px;border-top:1px solid var(--ln)}.mb input{margin:0}.cr{padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}.ci{width:42px;height:42px;border-radius:50%;background:var(--ti);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ro{padding:12px;text-align:center;color:var(--mu);border-top:1px solid var(--ln);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.tile{text-align:center;font-size:11px;padding:10px 2px;border-radius:12px;background:var(--ti);cursor:pointer;font-weight:600}.tile span{display:block;font-size:22px}#map{position:fixed;right:12px;top:78px;width:310px;max-height:75vh;overflow:auto;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px;z-index:8;box-shadow:0 8px 30px #0003}#map[hidden]{display:none}#map .it{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}#map .it b{display:block}
.scr,.main,.tw,.log,#map,.phone *{scrollbar-width:none;-ms-overflow-style:none}.scr::-webkit-scrollbar,.main::-webkit-scrollbar,.tw::-webkit-scrollbar,.log::-webkit-scrollbar,#map::-webkit-scrollbar{display:none;width:0;height:0}
.pw,.pw img{background:#fff}.card{box-shadow:0 1px 3px #1018280d}.tabs{box-shadow:0 -2px 8px #1018280a}.tabs button.on{box-shadow:inset 0 2px 0 var(--o)}.phone{box-shadow:0 18px 50px #10182833}
.sb{display:flex;justify-content:space-between;padding:6px 20px 2px;font-size:11px;font-weight:700;background:#fff;color:#23262d;flex:none}.sb.o{background:var(--o);color:#fff}
.push{position:absolute;top:30px;left:10px;right:10px;background:#fff;border-radius:14px;box-shadow:0 6px 20px #0004;padding:10px 12px;z-index:5;border-left:4px solid var(--o)}
.btn{padding:10px 16px;border-radius:12px}.card{border-radius:16px}
.hero{background:linear-gradient(135deg,#FF3B00,#ff7a45);color:#fff;border-radius:18px;padding:14px;margin-bottom:12px}.hero h3{margin:2px 0 4px}.hs{display:flex;gap:8px;margin-top:10px}.hs div{flex:1;background:#ffffff2e;border-radius:12px;padding:7px 4px;text-align:center;font-size:11px}.hs b{display:block;font-size:18px}
.em{text-align:center;padding:26px 10px;color:var(--mu)}.em div:first-child{font-size:34px}.em b{display:block;color:var(--tx)}
.ar{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--ln);border-radius:14px;margin-bottom:8px;cursor:pointer;background:var(--cd)}.cnt{background:var(--bg);border-radius:99px;min-width:26px;text-align:center;font-weight:700;padding:2px 8px}.cnt.hot{background:var(--o);color:#fff}
.bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--o)}.ib{display:flex;align-items:center;gap:8px;margin:5px 0}.ib .sm:first-child{width:92px}
.tabs button{position:relative}.bd{position:absolute;top:2px;left:54%;background:var(--rd);color:#fff;border-radius:99px;font-size:9px;font-style:normal;padding:1px 5px;font-weight:700}
.sbd{position:absolute;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:6}.sh{background:#fff;border-radius:22px 22px 0 0;padding:14px;width:100%;max-height:86%;overflow:auto}.sh h3{margin:0 0 8px}.gr{width:40px;height:4px;background:var(--ln);border-radius:9px;margin:0 auto 10px}.sh .scr{padding:0}
.ac{padding:9px 0;border-bottom:1px solid var(--ln)}.rl{background:#f8fafc;border:1px dashed var(--ln);border-radius:12px;padding:10px;font-size:12px;margin-top:10px}
