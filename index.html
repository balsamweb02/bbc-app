<style>

function sheet(){if(!S.sh)return'';const c=SH[S.sh];const share=S.sh=='share';return`<div class="sheet" data-a="shx"><div><div class="gr"></div><h2 style="font-size:21px;margin-bottom:14px">${c[0]}</h2>${share?chips('shT',[['Announcement','Announcement'],['Opportunity','Opportunity']],S.shT):''}${S.sh=='dec'?`<textarea class="in" id="s2" rows="3" placeholder="${c[1]}"></textarea>`:`<label>Title</label><input class="in" id="s1" placeholder="Title">${S.sh=='ev'?`<label>Date</label><input class="in" id="s3" type="date">`:''}<label>${c[1]}</label>${S.sh=='ev'||share||S.sh=='ann'||S.sh=='bc'?`<textarea class="in" id="s2" rows="3" placeholder="${c[1]}"></textarea>`:`<input class="in" id="s2" placeholder="${c[1]}">`}`}<button class="btn ${S.sh=='dec'?'no':''}" data-a="save">${S.sh=='dec'?'Decline':S.sh=='bc'?'Send':'Publish'}</button><button class="btn l" style="margin-top:10px;box-shadow:none" data-a="sh" data-v="">Cancel</button></div></div>`}
function render(){let k,p;const top=S.st[S.st.length-1];if(S.scr!='app')k=S.scr;else if(top){k=top.v;p=top.p}else k=(S.role=='admin'?'a_':'m_')+S.tab;
 const snap={};document.querySelectorAll('#app input[id],#app textarea[id],#app select[id]').forEach(x=>{if(x.id!='q'&&x.id!='pw')snap[x.id]=x.value});
 $('#ph').dataset.s=k=='splash'?'dark':'';const ap=$('#app');try{ap.innerHTML=V[k](p)+sheet()}catch(x){console.error(x);ap.innerHTML=V.err()}for(const id in snap){const x=document.getElementById(id);if(x&&!x.value)x.value=snap[id]}
 if(render.k!==k){render.k=k;ap.classList.remove('an');void ap.offsetWidth;ap.classList.add('an')}
 if(S.scr=='splash'&&!render.t)render.t=setTimeout(()=>{S.scr='welcome';render()},1600);

 const m=$('#msg');if(m)m.onkeydown=x=>{if(x.key=='Enter'){const b=m.nextElementSibling;act(b.dataset.a,b.dataset.v)}}}
function go(){S.st=[];S.sh=null;if(S.role=='admin'){S.scr='app';S.tab='dash'}else{const m=mineM(),st=m&&m.st;if(st=='pending'||st=='declined'||st=='suspended')S.scr=st;else{S.scr='app';S.tab='home'}}}
function act(a,v,p,ev){const val=id=>($(id)||{}).value||'';
 if(a=='toast')return toast(v);
 if(a=='eye'){const x=$('#pw');x.type=x.type=='password'?'text':'password';return}
 else if(a=='goto')S.scr=v;
 else if(a=='retry'){S.st=[];S.sh=null;if(S.scr!='app')S.scr='welcome'}
 else if(a=='forgot'){const x=val('#fg1').trim();if(x.length<5)return toast('Please enter your email or phone');S.scr='login';toast('Reset link sent. Check your inbox')}
 else if(a=='savepwd'){const n=val('#pw1'),c=val('#pw2');if(!val('#pw0'))return toast('Enter your current password');if(n.length<6)return toast('Use at least 6 characters');if(n!=c)return toast('Passwords do not match');S.st.pop();toast('Password updated')}
 else if(a=='start'){S.ob=0;S.scr='onboard'}
 else if(a=='next'){if(S.ob<2)S.ob++;else S.scr='reg'}
 else if(a=='loginm'){S.role='member';S.scr='login'}
 else if(a=='adminlogin'){S.role='admin';S.scr='login'}
 else if(a=='register'){const n=val('#f1').trim(),em=val('#f3').trim();if(n.length<2)return toast('Please enter your name');if(!/^\S+@\S+\.\S+$/.test(em))return toast('Please enter a valid email');if(mem(n))return toast('That name is already registered');D.members.push({n,r:val('#f2').trim()||'Business owner',ind:val('#f5'),city:'',e:em,ph:val('#f4').trim()||undefined,j:'Today',st:'pending'});D.mine=n;D.me=n;note('admin','New member request',n+' is waiting for approval');S.role='member';S.scr='pending'}
 else if(a=='login')go();
 else if(a=='check'||a=='reapply'){const m=mineM();if(a=='reapply'){m.st='pending';m.note='';note('admin','Member applied again',m.n);S.scr='pending'}else if(m&&m.st=='approved'){toast('You are approved. Welcome!');S.scr='app';S.st=[];S.tab='home'}else if(m&&m.st!='pending'){go()}else toast('Still under review. Please check again soon')}
 else if(a=='role'){S.role=v;go()}
 else if(a=='reset'){localStorage.removeItem(KEY);D=D0();S.scr='splash';S.role='member';S.st=[];S.tab='home';S.sh=null;render.t=0}
 else if(a=='logout'){S.scr='welcome';S.st=[];S.sh=null;S.role='member'}
 else if(a=='tab'){S.tab=v;S.st=[];if(p)S.mf=p}
 else if(a=='push'){if(v=='notif'){D.notifs.forEach(n=>{if(n.to==S.role)n.r=1})}S.st.push({v,p});if(v=='thread')delete D.un[p];if(v=='lrn')S.rc='All'}
 else if(a=='back')S.st.pop();
 else if(a=='seg'){S.seg=v}else if(a=='mf'){S.mf=v}else if(a=='shT'){S.shT=v}else if(a=='rc'){S.rc=v}
 else if(a=='dq'){S.dq=v}
 else if(a=='like'){const x=D.posts[v],i=x.lk.indexOf(D.me);i<0?x.lk.push(D.me):x.lk.splice(i,1)}
 else if(a=='interest'){const x=D.posts[v],i=x.ints.indexOf(D.me);if(i<0){x.ints.push(D.me);toast('Interest sent to '+(isAdm(x.by)?'S.K.I.N Team':x.by.split(' ')[0]))}else x.ints.splice(i,1)}
 else if(a=='delmine'){if(!confirm('Delete this post?'))return;D.posts.splice(v,1);toast('Post deleted')}
 else if(a=='reg'){const x=D.events[v];x.reg^=1;if(!x.reg)x.rem=0;if(x.reg)note('member','Registration confirmed',x.t);toast(x.reg?'You are registered':'Registration cancelled')}
 else if(a=='remind'){const x=D.events[v];x.rem^=1;toast(x.rem?'Reminder set':'Reminder removed')}
 else if(a=='connect'){const c=D.conn[v];if(c=='connected'){delete D.conn[v];toast('Connection removed')}else if(c=='sent'){delete D.conn[v];toast('Request withdrawn')}else{D.conn[v]='sent';toast('Request sent to '+v.split(' ')[0]);setTimeout(()=>{if(D.conn[v]=='sent'){D.conn[v]='connected';note('member','Request accepted',v+' accepted your connection request');sv();render()}},3500)}
  if(S.st.length&&S.st[S.st.length-1].v=='dir'){sv();const q=val('#q');render();if(q){$('#q').value=q;$('#list').innerHTML=listM(q)}return}}
 else if(a=='accept'){D.conn[v]='connected';D.reqs=D.reqs.filter(x=>x!=v);toast('You are now connected with '+v.split(' ')[0])}
 else if(a=='decline'){D.reqs=D.reqs.filter(x=>x!=v)}
 else if(a=='msg'){D.msgs[v]=D.msgs[v]||[];S.st.pop();S.st.push({v:'thread',p:v})}
 else if(a=='send'){const t=val('#msg').trim();if(!t)return;D.msgs[v].push(['me',t,tm()]);setTimeout(()=>{D.msgs[v].push([v=='Community Group'?'Priya Nair':v,'Thank you, noted.',tm()]);sv();const tp=S.st[S.st.length-1];if(tp&&tp.p==v)render()},1100)}
 else if(a=='catpost'){const t=val('#msg').trim();if(!t)return;D.cats[v].posts.push(['me',t,tm()])}
 else if(a=='saveprof'){const n=val('#e1').trim();if(n.length<2)return toast('Please enter your name');const m=me();Object.assign(m,{r:val('#e2').trim(),ind:val('#e3'),city:val('#e4').trim(),bio:val('#e5').trim(),off:val('#e6').trim(),seek:val('#e7').trim()});if(n!=D.me){if(mem(n))return toast('That name is taken');m.n=n;if(D.mine==D.me)D.mine=n;D.me=n}S.st.pop();toast('Profile saved')}
 else if(a=='tg'){if(v=='notif'||v=='priv')D[v]^=1;else D.perm[v]^=1}
 else if(a=='sh'){if(v=='share'&&!D.perm.post)return toast('Posting is turned off by admin');if(v=='ev'&&S.role!='admin'&&!D.perm.event)return toast('Events are turned off by admin');S.sh=v||null;if(v=='dec')S.decl=p;S.shT='Announcement'}
 else if(a=='shopp'){S.sh='share';S.shT='Opportunity'}
 else if(a=='shx'){if(!ev||!ev.target.classList.contains('sheet'))return;S.sh=null}
 else if(a=='save'){const t=val('#s1').trim(),d=val('#s2').trim(),k=S.sh,adm=S.role=='admin',by=adm?'S.K.I.N Admin':D.me;
  if(k=='dec'){const m=D.members[S.decl];m.st='declined';m.note=d;S.sh=null;S.st.pop();toast('Request declined');sv();render();return}
  if(!t)return toast('Please add a title');
  if(k=='share'||k=='ann'){if(!d)return toast('Please add a few details');const ty=k=='ann'?'Announcement':S.shT;D.posts.unshift({t,d,w:'Just now',by,ty,lk:[],ints:[]});if(ty=='Announcement')note('member',t,'New announcement from '+(adm?'S.K.I.N Team':D.me))}
  else if(k=='ev'){const dv=val('#s3'),dd=dv?new Date(dv+'T00:00'):new Date();D.events.push({t,day:String(dd.getDate()).padStart(2,'0'),mo:dd.toLocaleString('en',{month:'short'}),d:d||'Time to be announced',desc:d,reg:0,rem:0,by,go:0});note('member','New event',t)}
  else if(k=='res')D.res.unshift({t,d:d||'Resource',cat:'General',desc:'Shared by the S.K.I.N team.',saved:0});
  else if(k=='ben')D.ben.unshift({t,d:d||'Members only',who:'Partner',c:0});
  else if(k=='bc'){note('member',t,d||'');toast('Sent to '+(appr().length-1)+' members');S.sh=null;sv();render();return}
  S.sh=null;toast('Published')}
 else if(a=='del'){const[k,i]=v.split(':');if(!confirm('Remove this item?'))return;D[k].splice(+i,1);toast('Removed')}
 else if(a=='appr'){const m=D.members[v];m.st='approved';note('member','You are approved','Welcome to S.K.I.N, '+m.n.split(' ')[0]);S.st.pop();toast('Member approved')}
 else if(a=='susp'){const m=D.members[v];m.st='suspended';S.st.pop();toast('Member paused')}
 else if(a=='reinst'){D.members[v].st='approved';S.st.pop();toast('Member reinstated')}
 else if(a=='claim'){const b=D.ben[v];b.c^=1;toast(b.c?'Offer claimed':'Claim removed');if(b.c)note('admin','Offer claimed',D.me+' claimed "'+b.t+'"')}
 else if(a=='saveres'){const r=D.res[v];r.saved^=1;toast(r.saved?'Saved to your list':'Removed from saved')}
 else if(a=='dlres'){toast('Downloading '+D.res[v].t+'…')}
 else if(a=='sup'){const t=val('#hm').trim();if(t.length<5)return toast('Please describe your question');note('admin','Support request from '+D.me,t.slice(0,80));toast('Sent to support. We will reply soon');$('#hm').value=''}
 else if(a=='delacc'){if(!confirm('Request deletion of your account?'))return;note('admin','Deletion request',D.me);toast('Request sent to admins')}
 sv();render()}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v,b.dataset.p,ev)});
addEventListener('offline',()=>toast('You are offline. Changes will sync later'));addEventListener('online',()=>toast('Back online'));
render();
</script><script>
(function(){function fit(){var ph=document.getElementById('ph');if(!ph)return;
 if(innerWidth<500){ph.style.transform='';return}
 var s=Math.min(1,(innerHeight-24)/(ph.offsetHeight+24));ph.style.transform='scale('+s+')'}
 addEventListener('resize',fit);fit();setTimeout(fit,300)})();
</script>
